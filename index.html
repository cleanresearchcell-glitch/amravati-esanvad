<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cyber Crime e-Sanvad</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>

    body{
      background:#f4f7fb;
      font-family:Arial;
    }

    .main-card{
      max-width:700px;
      margin:auto;
      margin-top:40px;
      border-radius:20px;
    }

    .header{
      background:#0d6efd;
      color:white;
      padding:25px;
      border-radius:20px 20px 0 0;
      text-align:center;
    }

    .footer-note{
      font-size:14px;
      color:#666;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="card shadow main-card">

    <div class="header">

      <h2>Cyber Crime e-Sanvad</h2>

      <p class="mb-0">
        Online Meeting Request Portal
      </p>

    </div>

    <div class="card-body p-4">

      <form id="meetingForm">

        <label class="form-label">
          Full Name
        </label>

        <input type="text"
               class="form-control mb-3"
               placeholder="Enter Full Name"
               required>

        <label class="form-label">
          Mobile Number
        </label>

        <input type="tel"
               class="form-control mb-3"
               placeholder="Enter Mobile Number"
               required>

        <label class="form-label">
          Email Address
        </label>

        <input type="email"
               class="form-control mb-3"
               placeholder="Enter Email Address"
               required>

        <label class="form-label">
          Address
        </label>

        <textarea class="form-control mb-3"
                  rows="3"
                  placeholder="Enter Address"
                  required></textarea>

        <label class="form-label">
          Purpose of Meeting
        </label>

        <textarea class="form-control mb-3"
                  rows="3"
                  placeholder="Describe Cyber Crime Issue / Consultation Purpose"
                  required></textarea>

        <label class="form-label">
          Preferred Meeting Date
        </label>

        <input type="date"
               class="form-control mb-3"
               required>

        <label class="form-label">
          Preferred Meeting Time
        </label>

        <input type="time"
               class="form-control mb-4"
               required>

        <button class="btn btn-primary w-100 btn-lg">

          Submit Meeting Request

        </button>

      </form>

      <div class="alert alert-info mt-4">

        Meeting confirmation and secure online meeting link
        will be shared on your registered mobile number
        or email before the scheduled meeting.

      </div>

      <p class="footer-note text-center mt-3">

        Cyber Crime e-Sanvad Portal

      </p>

    </div>

  </div>

</div>
<script>

document.getElementById("meetingForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  const inputs =
  document.querySelectorAll("input, textarea");

  const data = {

    name: inputs[0].value,
    mobile: inputs[1].value,
    email: inputs[2].value,
    address: inputs[3].value,
    purpose: inputs[4].value,
    date: inputs[5].value,
    time: inputs[6].value

  };

  fetch(
    "https://script.google.com/macros/s/AKfycbxQxxDPSa71wAucrq-PHgKFmgYIbcfYtZ8ncjq9cQBWrjhatESgwviWWrdEkqFSQAv_/exec",
    {

      method: "POST",

      mode: "no-cors",

      headers: {

        "Content-Type":
        "application/json"

      },

      body:
      JSON.stringify(data)

    }

  )

  .then(() => {

    alert(
      "Meeting request submitted successfully"
    );

    document
    .getElementById("meetingForm")
    .reset();

  })

  .catch((error) => {

    console.log(error);

    alert(
      "Submission failed"
    );

  });

});

</script>
</body>
</html>
